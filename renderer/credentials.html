<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>ログイン情報の設定</title>
<style>
  :root {
    --bg: #111827;
    --panel: #1f2937;
    --fg: #f3f4f6;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --border: #374151;
    --error: #f87171;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #panel {
    width: 320px;
    background: var(--panel);
    padding: 24px;
    border-radius: 10px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 4px;
  }
  p.desc {
    font-size: 12px;
    color: #9ca3af;
    margin: 0 0 18px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12px;
    margin-bottom: 4px;
    color: #d1d5db;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    margin-bottom: 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--fg);
    font-size: 13px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 9px 0;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover {
    background: var(--accent-hover);
  }
  #error {
    color: var(--error);
    font-size: 12px;
    min-height: 16px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div id="panel">
    <h1>福知山公立大ポータル</h1>
    <p class="desc">初回起動時のみ、ポータルのログインID・パスワードを入力してください。<br />次回以降は自動でログインします。</p>
    <form id="cred-form">
      <label for="login-id">ログインID</label>
      <input id="login-id" type="text" autocomplete="username" required />
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button type="submit">保存してログイン</button>
      <div id="error"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('cred-form');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      const loginId = document.getElementById('login-id').value.trim();
      const password = document.getElementById('password').value;
      if (!loginId || !password) return;

      const result = await window.credentialAPI.save(loginId, password);
      if (!result.ok) {
        errorEl.textContent = result.message || '保存に失敗しました。';
      }
    });
  </script>
</body>
</html>
